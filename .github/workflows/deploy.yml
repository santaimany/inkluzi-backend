name: 🚀 Deploy to VPS

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  IMAGE_NAME: santaimany/mbg-backend
  CONTAINER_NAME: mbg-backend

jobs:
  build:
    name: 🔨 Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      - name: ✅ Build completed
        run: |
          echo "✅ Image built and pushed successfully!"
          echo "🏷️ Tags: latest, ${{ github.sha }}"

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_BASE64 }}" | tr -d '\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔄 Starting deployment..."
            cd /var/www/mbg-backend
            echo "📥 Pulling latest Docker image..."
            docker-compose pull
            echo "🔄 Recreating containers..."
            docker-compose up -d --force-recreate
            echo "⏳ Waiting for container to be ready..."
            sleep 10
            echo "🗄️ Running database migrations..."
            docker exec mbg-backend npx prisma migrate deploy
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            echo "✅ Deployment completed!"
            docker-compose ps
          EOF

      - name: 📊 Deployment Summary
        run: |
          echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: santaimany/mbg-backend:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed to**: ${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY